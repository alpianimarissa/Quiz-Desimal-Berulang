<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuis Interaktif FDP — Analisis Desimal Berulang (40 Soal)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<style>
:root {
  --bg-0: #f8fafc;
  --bg-1: #f1f5f9;
  --bg-2: #e2e8f0;
  --card: #ffffff;
  --card-brd: #e2e8f0;
  --accent-primary: #4f46e5;
  --accent-secondary: #2563eb;
  --accent-success: #059669;
  --accent-danger: #dc2626;
  --accent-warning: #d97706;
  --text-primary: #0f172a;
  --text-muted: #475569;
  --shadow-glow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05), 0 10px 15px -3px rgba(0, 0, 0, 0.03);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  min-height: 100vh;
  background:
    radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.03) 0%, transparent 40%),
    radial-gradient(circle at 90% 80%, rgba(59, 130, 246, 0.03) 0%, transparent 40%),
    var(--bg-0);
  color: var(--text-primary);
  font-family: 'Inter', sans-serif;
  overflow-x: hidden;
}

h1, h2, h3, .font-display {
  font-family: 'Plus Jakarta Sans', sans-serif;
  letter-spacing: -0.02em;
}

.app-shell {
  max-width: 960px;
  margin: 0 auto;
  padding: 20px 20px 140px;
  position: relative;
  z-index: 1;
  min-height: 100vh;
}

.top-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 4px 16px;
  border-bottom: 1px solid rgba(15, 23, 42, 0.08);
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  font-family: 'Plus Jakarta Sans';
  font-weight: 700;
  font-size: 1.15rem;
  color: var(--text-primary);
}

.brand svg {
  width: 28px;
  height: 28px;
  fill: none;
  stroke: var(--accent-primary);
  stroke-width: 2;
}

.header-meta {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.status-badge {
  font-size: .75rem;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 999px;
  background: #ecfdf5;
  color: var(--accent-success);
  border: 1px solid rgba(5, 150, 105, 0.2);
  display: flex;
  align-items: center;
  gap: 6px;
}

.status-badge.offline {
  background: #fffbebf1;
  color: var(--accent-warning);
  border-color: rgba(217, 119, 6, 0.2);
}

.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--accent-success);
}
.status-badge.offline .status-dot {
  background: var(--accent-warning);
}

.score-counter {
  font-size: .85rem;
  font-weight: 700;
  color: var(--accent-primary);
  background: #e0e7ff;
  border: 1px solid rgba(79, 70, 229, 0.15);
  padding: 6px 14px;
  border-radius: 999px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.02);
}

.reset-btn {
  font-size: .78rem;
  font-weight: 600;
  color: var(--text-muted);
  background: #ffffff;
  border: 1px solid var(--card-brd);
  padding: 5px 12px;
  border-radius: 999px;
  cursor: pointer;
  transition: all 0.2s;
}
.reset-btn:hover {
  background: #fee2e2;
  color: var(--accent-danger);
  border-color: #fca5a5;
}

.progress-track {
  height: 6px;
  border-radius: 999px;
  background: #e2e8f0;
  overflow: hidden;
  margin-bottom: 24px;
}

.progress-fill {
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--accent-secondary), var(--accent-primary));
  transition: width .3s ease;
}

.card {
  background: var(--card);
  border: 1px solid var(--card-brd);
  border-radius: 16px;
  padding: 24px;
  margin-bottom: 20px;
  box-shadow: var(--shadow-glow);
}

.page-title {
  font-size: 1.4rem;
  font-weight: 800;
  color: var(--text-primary);
  margin: 0 0 6px;
}

.page-sub {
  color: var(--text-muted);
  font-size: .92rem;
  margin: 0 0 20px;
  line-height: 1.6;
}

.eyebrow {
  display: inline-block;
  font-size: .68rem;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: #fff;
  background: var(--accent-secondary);
  padding: 5px 12px;
  border-radius: 6px;
  margin-bottom: 12px;
}

.option-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
  margin: 18px 0;
}

.option-btn {
  background: #ffffff;
  border: 1.5px solid var(--card-brd);
  border-radius: 12px;
  padding: 16px;
  text-align: left;
  font-family: 'Inter', sans-serif;
  font-size: .98rem;
  color: var(--text-primary);
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
}

.option-btn:hover:not(:disabled) {
  border-color: var(--accent-primary);
  background: #f8fafc;
}

.option-btn.correct {
  background: rgba(16, 185, 129, 0.08);
  border-color: var(--accent-success);
  color: #065f46;
  font-weight: 600;
}

.option-btn.wrong {
  background: rgba(220, 38, 38, 0.08);
  border-color: var(--accent-danger);
  color: #991b1b;
}

.option-btn:disabled {
  cursor: default;
}

.badge-letter {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: #f1f5f9;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: .85rem;
  flex-shrink: 0;
}

.option-btn.correct .badge-letter {
  background: var(--accent-success);
  color: #ffffff;
}

.option-btn.wrong .badge-letter {
  background: var(--accent-danger);
  color: #ffffff;
}

.feedback-container {
  margin-top: 16px;
  padding: 18px;
  border-radius: 12px;
  display: none;
  animation: fadein 0.3s ease;
}

.feedback-container.show {
  display: block;
}

.feedback-container.correct-style {
  background: rgba(16, 185, 129, 0.06);
  border-left: 4px solid var(--accent-success);
  color: #065f46;
}

.feedback-container.wrong-style {
  background: rgba(220, 38, 38, 0.06);
  border-left: 4px solid var(--accent-danger);
  color: #991b1b;
}

.explanation-title {
  font-weight: 700;
  font-family: 'Plus Jakarta Sans';
  font-size: .95rem;
  margin-bottom: 6px;
}

.explanation-body {
  font-size: .92rem;
  line-height: 1.65;
  color: var(--text-primary);
}

.grid-navigation {
  display: grid;
  grid-template-columns: repeat(10, 1fr);
  gap: 8px;
  margin-top: 12px;
}

@media (max-width: 640px) {
  .grid-navigation {
    grid-template-columns: repeat(5, 1fr);
  }
}

.nav-dot {
  aspect-ratio: 1;
  background: #ffffff;
  border: 1px solid var(--card-brd);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: .8rem;
  font-weight: 700;
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.15s;
}

.nav-dot:hover {
  border-color: var(--accent-primary);
  color: var(--accent-primary);
}

.nav-dot.active {
  background: var(--accent-primary);
  color: #ffffff;
  border-color: transparent;
  box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.3);
}

.nav-dot.answered-correct {
  background: rgba(16, 185, 129, 0.15);
  color: var(--accent-success);
  border-color: var(--accent-success);
}

.nav-dot.answered-wrong {
  background: rgba(220, 38, 38, 0.15);
  color: var(--accent-danger);
  border-color: var(--accent-danger);
}

.center { text-align: center; }

.bottom-nav {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  z-index: 5;
  background: rgba(255, 255, 255, 0.92);
  backdrop-filter: blur(12px);
  padding: 14px 20px 20px;
  border-top: 1px solid #cbd5e1;
}
.bottom-nav-inner {
  max-width: 960px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: 12px;
}
.nav-btn {
  flex: none;
  background: #ffffff;
  border: 1px solid #cbd5e1;
  color: var(--text-primary);
  padding: 12px 20px;
  border-radius: 10px;
  font-weight: 600;
  font-family: 'Plus Jakarta Sans';
  cursor: pointer;
  font-size: .9rem;
  transition: all 0.2s;
}
.nav-btn:hover:not(:disabled) { background: #f8fafc; border-color: #cbd5e1; }
.nav-btn.primary {
  background: var(--accent-primary);
  color: #fff;
  border: none;
  flex: 1;
  text-align: center;
}
.nav-btn.primary:hover:not(:disabled) {
  background: #4f46e5;
  box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2);
}
.nav-btn:disabled { opacity: .3; cursor: not-allowed; }
.page-jump {
  flex: none;
  background: #ffffff;
  border: 1px solid #cbd5e1;
  color: var(--text-primary);
  border-radius: 10px;
  padding: 12px;
  font-family: 'Inter';
  font-size: .85rem;
  max-width: 100px;
}
.page-counter {
  font-size: .8rem;
  color: var(--text-muted);
  background: var(--card);
  border: 1px solid var(--card-brd);
  padding: 6px 14px;
  border-radius: 999px;
  white-space: nowrap;
  box-shadow: 0 1px 2px rgba(0,0,0,0.02);
}

@keyframes fadein {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>

<div class="app-shell">

  <div class="top-header">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M4 19.5A2.5 2.5 0 0 0 6.5 22H20M4 19.5V5A2.5 2.5 0 0 1 6.5 2.5H20v14H6.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Evaluasi Akademik FDP</span>
    </div>
    
    <div class="header-meta">
      <div class="status-badge" id="storage-status">
        <span class="status-dot"></span>
        <span>Tersimpan Otomatis</span>
      </div>
      <div class="page-counter" id="page-counter">Soal 1 dari 40</div>
      <div class="score-counter" id="score-counter">Benar: 0 / 40</div>
      <button class="reset-btn" onclick="app.confirmReset()" title="Reset seluruh jawaban">Reset ↺</button>
    </div>
  </div>

  <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width: 0%"></div></div>

  <div id="page-content"></div>

</div>

<div class="bottom-nav">
  <div class="bottom-nav-inner">
    <button class="nav-btn" id="btn-prev" disabled>‹ Kembali</button>
    <select class="page-jump" id="page-jump" title="Loncat ke nomor soal"></select>
    <button class="nav-btn primary" id="btn-next">Lanjut ›</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script>
// Database 40 Soal FDP, Desimal Berulang, dan Penerapan Praktis
const QUESTIONS = [
  {
    id: 1,
    eyebrow: "Konversi Desimal Berulang 1 Digit",
    title: "Deret Geometri Tak Hingga Sederhana",
    sub: "Konversikan desimal berulang paling dasar menuju bentuk pecahan.",
    q: "Ubah bentuk desimal berulang berikut menjadi pecahan biasa yang paling sederhana:<br><div class='center' style='font-size:1.3rem; margin:10px 0;'>\\(0,3333\\dots\\)</div>",
    options: [
      "\\(\\frac{3}{10}\\)",
      "\\(\\frac{33}{100}\\)",
      "\\(\\frac{1}{3}\\)",
      "\\(\\frac{1}{9}\\)"
    ],
    correctIdx: 2, // C
    explain: "Misalkan \\(x = 0,3333\\dots\\). Maka, \\(10x = 3,3333\\dots\\). Dengan mengurangkan kedua persamaan:<br>\\(10x - x = 3,3333\\dots - 0,3333\\dots\\)<br>\\(9x = 3\\)<br>\\(x = \\frac{3}{9} = \\frac{1}{3}\\)."
  },
  {
    id: 2,
    eyebrow: "Konversi Desimal Berulang 1 Digit",
    title: "Nilai Limit Desimal Sederhana",
    sub: "Menelaah nilai pecahan dasar satu digit berulang.",
    q: "Berapakah bentuk pecahan murni dari nilai berikut?<br><div class='center' style='font-size:1.3rem; margin:10px 0;'>\\(0,6666\\dots\\)</div>",
    options: [
      "\\(\\frac{6}{10}\\)",
      "\\(\\frac{3}{5}\\)",
      "\\(\\frac{66}{99}\\) (belum sederhana)",
      "\\(\\frac{2}{3}\\)"
    ],
    correctIdx: 3, // D
    explain: "Misalkan \\(x = 0,6666\\dots\\). Maka \\(10x = 6,6666\\dots\\). Pengurangan aljabar menghasilkan:<br>\\(9x = 6 \\implies x = \\frac{6}{9} = \\frac{2}{3}\\)."
  },
  {
    id: 3,
    eyebrow: "Aturan Sembilan Dasar",
    title: "Aturan Pembagi Sembilan",
    sub: "Memahami representasi pecahan satu digit berulang terkecil.",
    q: "Jika desimal berulang bernilai \\(0,1111\\dots\\), pecahan sederhana mana yang tepat mewakili nilai tersebut?",
    options: [
      "\\(\\frac{1}{10}\\)",
      "\\(\\frac{1}{9}\\)",
      "\\(\\frac{1}{99}\\)",
      "\\(\\frac{11}{100}\\)"
    ],
    correctIdx: 1, // B
    explain: "Sesuai pembuktian aljabar:<br>\\(10x = 1,111\\dots\\)<br>\\(x = 0,111\\dots\\)<br>\\(9x = 1 \\implies x = \\frac{1}{9}\\)."
  },
  {
    id: 4,
    eyebrow: "Aturan Sembilan Dasar",
    title: "Representasi Desimal Berulang Tinggi",
    sub: "Mencari pecahan dari satu digit bernilai tinggi yang berulang.",
    q: "Tentukan bentuk pecahan paling sederhana dari desimal berulang berikut:<br><div class='center' style='font-size:1.3rem; margin:10px 0;'>\\(0,7777\\dots\\)</div>",
    options: [
      "\\(\\frac{7}{9}\\)",
      "\\(\\frac{77}{100}\\)",
      "\\(\\frac{7}{10}\\)",
      "\\(\\frac{3}{4}\\)"
    ],
    correctIdx: 0, // A
    explain: "Berdasarkan teorema generalisasi desimal berulang 1 digit: \\(0,aaaa\\dots = \\frac{a}{9}\\). Maka \\(0,7777\\dots = \\frac{7}{9}\\)."
  },
  {
    id: 5,
    eyebrow: "Konversi Desimal Berulang 2 Digit",
    title: "Pengulangan Dua Angka Independen",
    sub: "Memahami manipulasi aljabar dengan pengali seratus.",
    q: "Nyatakan desimal berulang berikut sebagai pecahan biasa paling sederhana:<br><div class='center' style='font-size:1.3rem; margin:10px 0;'>\\(0,161616\\dots\\)</div>",
    options: [
      "\\(\\frac{16}{100}\\)",
      "\\(\\frac{4}{25}\\)",
      "\\(\\frac{16}{90}\\)",
      "\\(\\frac{16}{99}\\)"
    ],
    correctIdx: 3, // D
    explain: "Karena periode pengulangan terdiri atas 2 digit (16), kita gunakan pengali \\(10^2 = 100\\):<br>\\(100x = 16,161616\\dots\\)<br>\\(x = 0,161616\\dots\\)<br>\\(99x = 16 \\implies x = \\frac{16}{99}\\)."
  },
  {
    id: 6,
    eyebrow: "Konversi Desimal Berulang 2 Digit",
    title: "Penyederhanaan Fraksional Kompleks",
    sub: "Mengonversi desimal berulang dua digit dengan penyederhanaan tingkat lanjut.",
    q: "Tentukan nilai pecahan paling sederhana dari bentuk desimal berikut:<br><div class='center' style='font-size:1.3rem; margin:10px 0;'>\\(0,272727\\dots\\)</div>",
    options: [
      "\\(\\frac{27}{100}\\)",
      "\\(\\frac{3}{11}\\)",
      "\\(\\frac{27}{99}\\)",
      "\\(\\frac{9}{33}\\)"
    ],
    correctIdx: 1, // B
    explain: "Konversi dasar menghasilkan pecahan \\(\\frac{27}{99}\\). Kedua ruas dibagi dengan FPB dari 27 dan 99, yaitu 9:<br>\\(\\frac{27 \\div 9}{99 \\div 9} = \\frac{3}{11}\\)."
  },
  {
    id: 7,
    eyebrow: "Konversi Desimal Berulang 2 Digit",
    title: "Periode Angka Kuadratik",
    sub: "Menemukan bentuk fraksional sederhana dari periode berulang berkelipatan 9.",
    q: "Bentuk pecahan biasa yang setara dengan desimal berulang berikut adalah:<br><div class='center' style='font-size:1.3rem; margin:10px 0;'>\\(0,363636\\dots\\)</div>",
    options: [
      "\\(\\frac{36}{100}\\)",
      "\\(\\frac{9}{25}\\)",
      "\\(\\frac{4}{11}\\)",
      "\\(\\frac{36}{90}\\)"
    ],
    correctIdx: 2, // C
    explain: "Nilai konversinya adalah \\(\\frac{36}{99}\\). Jika disederhanakan dengan membagi pembilang dan penyebut dengan 9:<br>\\(\\frac{36 \\div 9}{99 \\div 9} = \\frac{4}{11}\\)."
  },
  {
    id: 8,
    eyebrow: "Konversi Desimal Berulang 2 Digit",
    title: "Periode Angka Nol-Sembilan",
    sub: "Menganalisis desimal berulang dengan awalan nol.",
    q: "Ubah bentuk desimal berikut menjadi pecahan biasa yang paling sederhana:<br><div class='center' style='font-size:1.3rem; margin:10px 0;'>\\(0,090909\\dots\\)</div>",
    options: [
      "\\(\\frac{1}{11}\\)",
      "\\(\\frac{9}{100}\\)",
      "\\(\\frac{1}{111}\\)",
      "\\(\\frac{9}{90}\\)"
    ],
    correctIdx: 0, // A
    explain: "Karena periode berulangnya adalah 09, maka rasionya ditulis \\(\\frac{9}{99}\\). Jika disederhanakan dengan membagi pembilang dan penyebut dengan 9, diperoleh \\(\\frac{1}{11}\\)."
  },
  {
    id: 9,
    eyebrow: "Konversi Desimal Berulang 3 Digit",
    title: "Pola Pengulangan Tiga Digit",
    sub: "Pembuktian dengan sistem persamaan linear aljabar pengali 1000.",
    q: "Konversikan desimal berulang tiga digit berikut menjadi pecahan biasa yang paling sederhana:<br><div class='center' style='font-size:1.3rem; margin:10px 0;'>\\(0,125125125\\dots\\)</div>",
    options: [
      "\\(\\frac{125}{1000}\\)",
      "\\(\\frac{1}{8}\\)",
      "\\(\\frac{125}{990}\\)",
      "\\(\\frac{125}{999}\\)"
    ],
    correctIdx: 3, // D
    explain: "Misalkan \\(z = 0,125125125\\dots\\). Karena polanya 3 digit, kalikan dengan 1000:<br>\\(1000z = 125,125125\\dots\\)<br>\\(1000z - z = 125 \\implies 999z = 125 \\implies z = \\frac{125}{999}\\)."
  },
  {
    id: 10,
    eyebrow: "Konversi Desimal Berulang 2 Digit",
    title: "Kalkulasi Fraksional Desimal Sembilan Puluh Sembilan",
    sub: "Penyederhanaan dua digit kelipatan besar.",
    q: "Pecahan biasa paling sederhana dari desimal berulang \\(0,454545\\dots\\) adalah...",
    options: [
      "\\(\\frac{9}{20}\\)",
      "\\(\\frac{5}{11}\\)",
      "\\(\\frac{45}{99}\\) (belum sederhana)",
      "\\(\\frac{45}{100}\\)"
    ],
    correctIdx: 1, // B
    explain: "Desimal berulang \\(0,454545\\dots = \\frac{45}{99}\\). Pembilang dan penyebut disederhanakan dengan dibagi 9:<br>\\(\\frac{45 \\div 9}{99 \\div 9} = \\frac{5}{11}\\)."
  },
  {
    id: 11,
    eyebrow: "Konversi Desimal Berulang 2 Digit",
    title: "Analisis Desimal Berulang Delapan Belas",
    sub: "Konversi rasio desimal 18.",
    q: "Bentuk pecahan biasa paling sederhana dari \\(0,181818\\dots\\) adalah...",
    options: [
      "\\(\\frac{9}{50}\\)",
      "\\(\\frac{18}{100}\\)",
      "\\(\\frac{2}{11}\\)",
      "\\(\\frac{18}{99}\\) (belum sederhana)"
    ],
    correctIdx: 2, // C
    explain: "Desimal \\(0,181818\\dots = \\frac{18}{99}\\). Dibagi dengan FPB-nya yaitu 9:<br>\\(\\frac{18 \\div 9}{99 \\div 9} = \\frac{2}{11}\\)."
  },
  {
    id: 12,
    eyebrow: "Representasi Campuran",
    title: "Konversi di Atas Nilai Satu",
    sub: "Menyelesaikan desimal berulang campuran di atas satu bulat.",
    q: "Ubah bentuk desimal berulang berikut menjadi pecahan campuran paling sederhana:<br><div class='center' style='font-size:1.3rem; margin:10px 0;'>\\(1,3333\\dots\\)</div>",
    options: [
      "\\(1\\frac{1}{3}\\)",
      "\\(1\\frac{3}{10}\\)",
      "\\(\\frac{133}{100}\\)",
      "\\(1\\frac{1}{9}\\)"

    explain: "Sumbangan sosial = \\(0,363636\\dots = \\frac{36}{99} = \\frac{4}{11}\\).<br>Sisa uang = \\(1 - \\frac{4}{11} = \\frac{7}{11}\\).<br>Total sisa rupiah = \\(\\frac{7}{11} \\times \\text{Rp } 990.000.000,00 = \\text{Rp } 630.000.000,00\\).<br>Bagian tiap anak = \\(\\text{Rp } 630.000.000,00 \\div 4 = \\text{Rp } 157.500.000,00\\)."
  },
  {
    id: 38,
    eyebrow: "Penerapan Demografi Penduduk",
    title: "Estimasi Populasi Total Kota",
    sub: "Menghitung total populasi dari jumlah penduduk lansia.",
    q: "Di kota X, sebanyak \\(0,181818\\dots\\) dari total penduduk berusia di atas 60 tahun (lansia). Jika jumlah warga lansia adalah 36.000 jiwa, berapakah total jumlah penduduk kota tersebut?",
    options: [
      "180.000 jiwa",
      "190.000 jiwa",
      "210.000 jiwa",
      "198.000 jiwa"
    ],
    correctIdx: 3, // D
    explain: "Bagian lansia = \\(0,181818\\dots = \\frac{18}{99} = \\frac{2}{11}\\).<br>Misalkan total penduduk = \\(N\\), maka:<br>\\(\\frac{2}{11} N = 36.000 \\implies N = \\frac{36.000 \\times 11}{2} = 18.000 \\times 11 = 198.000 \\text{ jiwa}\\)."
  },
  {
    id: 39,
    eyebrow: "Penerapan Sains Kimia Laboratorium",
    title: "Massa Zat Aktif dalam Larutan",
    sub: "Menghitung massa gram bahan kimia dari sampel uji.",
    q: "Dalam uji laboratorium, massa zat A dicatat sebesar \\(0,05555\\dots\\) bagian dari sampel larutan. Jika massa total sampel adalah 180 gram, berapa gram massa zat A tersebut?",
    options: [
      "15 gram",
      "10 gram",
      "12 gram",
      "18 gram"
    ],
    correctIdx: 1, // B
    explain: "Konversi desimal berulang \\(0,05555\\dots\\):<br>\\(x = 0,05555\\dots \\implies 10x = 0,5555\\dots \\implies 10x = \\frac{5}{9} \\implies x = \\frac{5}{90} = \\frac{1}{18}\\).<br>Massa zat A = \\(\\frac{1}{18} \\times 180 \\text{ gram} = 10 \\text{ gram}\\)."
  },
  {
    id: 40,
    eyebrow: "Penerapan Teknik Pengisian Tangki Air",
    title: "Waktu Pengisian Tangki Pompa Air",
    sub: "Menghitung durasi menit untuk pengisian tangki secara penuh.",
    q: "Sebuah keran mampu mengisi \\(0,02777\\dots\\) bagian tangki air setiap menitnya. Berapa menit waktu yang dibutuhkan keran untuk mengisi tangki hingga penuh (1 bagian utuh)?",
    options: [
      "30 menit",
      "45 menit",
      "36 menit",
      "40 menit"
    ],
    correctIdx: 2, // C
    explain: "Konversi laju pengisian per menit \\(x = 0,02777\\dots\\):<br>\\(100x = 2,777\\dots\\)<br>\\(10x = 0,2777\\dots\\)<br>\\(90x = 2,5 \\implies 900x = 25 \\implies x = \\frac{25}{900} = \\frac{1}{36}\\) bagian/menit.<br>Waktu untuk mengisi 1 bagian utuh = \\(1 \\div \\frac{1}{36} = 36 \\text{ menit}\\)."
  }
];

// Quiz Application Class
class QuizApp {
  constructor() {
    this.storageKey = 'fdp_quiz_state_v3';
    this.currentIdx = 0; // Langsung mulai di Soal 1 (index 0)
    this.answersState = Array(QUESTIONS.length).fill(null);
    
    this.loadFromStorage();
    this.init();
  }

  init() {
    this.renderDropdown();
    this.loadPage(this.currentIdx);
    this.updateScoreCounter();

    // Event Listener Navigasi
    document.getElementById('btn-prev').addEventListener('click', () => this.prevPage());
    document.getElementById('btn-next').addEventListener('click', () => this.nextPage());
    document.getElementById('page-jump').addEventListener('change', (e) => this.jumpToPage(parseInt(e.target.value)));

    // Monitoring status online / offline
    window.addEventListener('online', () => this.updateOnlineStatus());
    window.addEventListener('offline', () => this.updateOnlineStatus());
    this.updateOnlineStatus();
  }

  updateOnlineStatus() {
    const badge = document.getElementById('storage-status');
    if (!badge) return;
    if (navigator.onLine) {
      badge.className = 'status-badge';
      badge.innerHTML = '<span class="status-dot"></span><span>Tersimpan Otomatis</span>';
    } else {
      badge.className = 'status-badge offline';
      badge.innerHTML = '<span class="status-dot"></span><span>Mode Luring (Offline)</span>';
    }
  }

  saveToStorage() {
    try {
      const state = {
        answersState: this.answersState,
        currentIdx: this.currentIdx
      };
      localStorage.setItem(this.storageKey, JSON.stringify(state));
    } catch (e) {
      console.warn("Lokal storage tidak didukung atau penuh", e);
    }
  }

  loadFromStorage() {
    try {
      const saved = localStorage.getItem(this.storageKey);
      if (saved) {
        const parsed = JSON.parse(saved);
        if (Array.isArray(parsed.answersState) && parsed.answersState.length === QUESTIONS.length) {
          this.answersState = parsed.answersState;
        }
        if (typeof parsed.currentIdx === 'number' && parsed.currentIdx >= 0 && parsed.currentIdx < QUESTIONS.length) {
          this.currentIdx = parsed.currentIdx;
        }
      }
    } catch (e) {
      console.warn("Gagal memuat state dari localStorage", e);
    }
  }

  renderDropdown() {
    const select = document.getElementById('page-jump');
    select.innerHTML = '';

    QUESTIONS.forEach((q, idx) => {
      const opt = document.createElement('option');
      opt.value = idx;
      opt.textContent = `Soal ${q.id}`;
      select.appendChild(opt);
    });
  }

  loadPage(index) {
    if (index < 0 || index >= QUESTIONS.length) return;
    this.currentIdx = index;
    this.saveToStorage();

    const contentContainer = document.getElementById('page-content');
    const q = QUESTIONS[index];
    const answered = this.answersState[index];
    
    let optionsHtml = q.options.map((opt, oIdx) => {
      let btnClass = '';
      if (answered !== null) {
        if (oIdx === q.correctIdx) {
          btnClass = 'correct';
        } else if (answered === oIdx) {
          btnClass = 'wrong';
        }
      }

      return `
        <button class="option-btn ${btnClass}" onclick="app.submitAnswer(${oIdx})" ${answered !== null ? 'disabled' : ''}>
          <span class="badge-letter">${['A', 'B', 'C', 'D'][oIdx]}</span>
          <span>${opt}</span>
        </button>
      `;
    }).join('');

    let feedbackClass = 'feedback-container';
    let feedbackTitle = '';
    if (answered !== null) {
      feedbackClass += ' show ' + (answered === q.correctIdx ? 'correct-style' : 'wrong-style');
      feedbackTitle = answered === q.correctIdx ? '✓ Jawaban Anda Benar!' : '✗ Jawaban Belum Tepat!';
    }

    contentContainer.innerHTML = `
      <div class="card">
        <div class="eyebrow">${q.eyebrow}</div>
        <h1 class="page-title" style="font-size:1.35rem; font-weight:700; margin-top:4px;">Soal ${q.id}: ${q.title}</h1>
        <p class="page-sub" style="margin-bottom:16px;">${q.sub}</p>

        <p style="font-size:1.02rem; line-height:1.7; margin-bottom:20px;">${q.q}</p>

        <div class="option-grid">${optionsHtml}</div>

        <div class="${feedbackClass}" id="feedback-panel">
          <div class="explanation-title">${feedbackTitle}</div>
          <div class="explanation-body">
            <b>Pembahasan & Langkah Aljabar:</b><br>
            ${q.explain}
          </div>
        </div>
      </div>

      <div class="card" style="padding:16px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
          <h3 style="font-size:.9rem; text-transform:uppercase; letter-spacing:.05em; color:var(--text-muted); margin:0;">Peta Navigasi Soal</h3>
          <span style="font-size:.78rem; color:var(--text-muted);">Klik nomor untuk meloncat</span>
        </div>
        <div class="grid-navigation" id="grid-nav"></div>
      </div>
    `;

    this.renderGridNavigation();
    
    // Update tombol navigasi
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    btnPrev.disabled = (index === 0);
    btnNext.disabled = (index === QUESTIONS.length - 1);
    btnNext.textContent = (index === QUESTIONS.length - 1) ? "Soal Terakhir" : "Lanjut ›";

    this.updateProgressFill();
    this.renderMath(contentContainer);
    document.getElementById('page-jump').value = index;
  }

  submitAnswer(optIdx) {
    if (this.answersState[this.currentIdx] !== null) return;
    this.answersState[this.currentIdx] = optIdx;
    this.saveToStorage();
    this.updateScoreCounter();
    this.loadPage(this.currentIdx);
  }

  countCorrectAnswers() {
    return this.answersState.reduce((acc, ans, qIdx) => {
      return acc + (ans === QUESTIONS[qIdx].correctIdx ? 1 : 0);
    }, 0);
  }

  updateScoreCounter() {
    const totalCorrect = this.countCorrectAnswers();
    document.getElementById('score-counter').textContent = `Benar: ${totalCorrect} / ${QUESTIONS.length}`;
  }

  updateProgressFill() {
    const progressPercent = Math.round(((this.currentIdx + 1) / QUESTIONS.length) * 100);
    document.getElementById('progress-fill').style.width = `${progressPercent}%`;
    document.getElementById('page-counter').textContent = `Soal ${this.currentIdx + 1} dari ${QUESTIONS.length}`;
  }

  renderGridNavigation() {
    const grid = document.getElementById('grid-nav');
    if (!grid) return;
    grid.innerHTML = '';

    QUESTIONS.forEach((q, idx) => {
      const dot = document.createElement('div');
      dot.className = 'nav-dot';
      dot.textContent = q.id;
      
      const answered = this.answersState[idx];
      if (idx === this.currentIdx) {
        dot.classList.add('active');
      } else if (answered !== null) {
        if (answered === q.correctIdx) {
          dot.classList.add('answered-correct');
        } else {
          dot.classList.add('answered-wrong');
        }
      }

      dot.onclick = () => this.loadPage(idx);
      grid.appendChild(dot);
    });
  }

  renderMath(element) {
    try {
      if (typeof renderMathInElement === 'function') {
        renderMathInElement(element, {
          delimiters: [
            { left: '$$', right: '$$', display: true },
            { left: '\\(', right: '\\)', display: false },
            { left: '\\[', right: '\\]', display: true }
          ],
          throwOnError: false
        });
      }
    } catch (e) {
      console.warn("KaTeX rendering warning:", e);
    }
  }

  nextPage() {
    if (this.currentIdx < QUESTIONS.length - 1) {
      this.loadPage(this.currentIdx + 1);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  }

  prevPage() {
    if (this.currentIdx > 0) {
      this.loadPage(this.currentIdx - 1);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  }

  jumpToPage(index) {
    this.loadPage(index);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  confirmReset() {
    if (confirm("Apakah Anda yakin ingin menghapus semua jawaban dan mengulang kuis dari Soal 1?")) {
      this.resetQuiz();
    }
  }

  resetQuiz() {
    this.answersState = Array(QUESTIONS.length).fill(null);
    localStorage.removeItem(this.storageKey);
    this.updateScoreCounter();
    this.loadPage(0);
  }
}

let app;
window.onload = function() {
  app = new QuizApp();
};
</script>
</body>
</html>
